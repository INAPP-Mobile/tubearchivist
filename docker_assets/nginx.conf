server {
    listen 8000;

    location /cache/videos/ {
        auth_request /api/ping/;
        alias /cache/videos/;
    }
    
    location /cache/channels/ {
        auth_request /api/ping/;
        alias /cache/channels/;
    }
    
    location /cache/playlists/ {
        auth_request /api/ping/;
        alias /cache/playlists/;
    }

    # TA_MEDIA_DIR=/cache/youtube — player requests /cache/youtube/<channel>/<id>.mp4
    # directly (media_url = MEDIA_DIR + relative path), so URL must pass through 1:1
    location /cache/youtube/ {
        auth_request /api/ping/;
        alias /cache/youtube/;
        types {
            video/mp4 mp4;
            video/webm webm;
            text/vtt vtt;
        }
    }
    location /api {
        include proxy_params;
        proxy_pass http://localhost:8080;
    }

    location /admin {
        include proxy_params;
        proxy_pass http://localhost:8080;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    root   /app/static;
    index  index.html;

    location ^~ /css/ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location ~* ^/(?!static/|cache/).*\.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        try_files $uri $uri/ /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        try_files $uri $uri/ /index.html =404;
    }
}
